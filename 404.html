      // Visitors who picked Indonesian land on /id when they open the site root. This runs before the
      // prerendered English home paints. The key matches LOCALE_STORAGE_KEY in src/i18n/locale.ts.

        try {
          if (location.pathname === '/' && localStorage.getItem('locale') === 'id') location.replace('/id');
        } catch (e) {}
      })();

        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          document.documentElement.classList.add('dark');
        }
      })();
